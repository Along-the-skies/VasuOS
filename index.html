<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>VasuOS</title>

        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    </head>

    <body>
        <div id="desktop">

            <div id="top-bar">
                <div id="system-name">
                    VasuOS
                </div>

                <div id="system-status">
                    <span>
                        <i class="fa-solid fa-wifi"></i>
                    </span>

                    <span>
                        <i class="fa-solid fa-volume-high"></i>
                    </span>

                    <span>
                        <i class="fa-solid fa-battery-three-quarters"></i>
                    </span>

                    <span>
                        18:42
                    </span>
                </div>
            </div>
            
            <div class="window">

                <div class="window-header">

                    <div class="window-title">
                        <i class="fa-solid fa-folder"></i>
                        Files
                    </div>

                    <div class="window-controls">
                        <button>−</button>
                        <button>□</button>
                        <button>×</button>
                    </div>

                </div>

                <div class="window-content">
                    <h2>Files</h2>
                    <p>Welcome to VasuOS Files.</p>
                </div>

                <div class="resize-handle"></div>

            </div>

            <div class="window" id="terminal-window">
                <div class="window-header">

                    <div class="window-title">
                        <i class="fa-solid fa-terminal"></i>
                        Terminal
                    </div>

                    <div class="window-controls">
                        <button>−</button>
                        <button>□</button>
                        <button>×</button>
                    </div>

                </div>

                <div class="window-content terminal-content">

                    <div class="terminal-output">
                        <p>VasuOS Terminal</p>
                        <p>Type <strong>help</strong> to see available commands.</p>
                    </div>

                    <div class="terminal-input">
                        <span>vasu@vasuos:~$</span>
                        <input type="text" autocomplete="off" autofocus>
                    </div>

                </div>

                <div class="resize-handle"></div>
            </div>

            <div id="dock">

                <div class="dock-item">
                    <i class="fa-solid fa-house"></i>
                </div>

                <div class="dock-item">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>

                <div class="dock-item">
                    <i class="fa-solid fa-folder"></i>
                </div>

                <div class="dock-item">
                    <i class="fa-solid fa-terminal"></i>
                </div>

                <div class="dock-item">
                    <i class="fa-solid fa-gear"></i>
                </div>

            </div>

        </div>

        <script type="module" src="script.js"></script>
    </body>
</html>
